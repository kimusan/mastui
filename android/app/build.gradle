plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'dk.schulz.mastui'
    compileSdk 34

    defaultConfig {
        applicationId "dk.schulz.mastui"
        minSdk 26
        targetSdk 34
        versionCode 11200
        versionName "1.12.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
        }

        python {
            version "3.11"
            pip {
                install "textual>=0.70.0"
                install "textual-image>=0.2.0"
                install "mastodon.py>=1.8.1"
                install "requests>=2.31.0"
                install "httpx>=0.27.0"
                install "pillow>=10.0.0"
                install "beautifulsoup4>=4.12.0"
                install "html2text>=2024.2.26"
                install "python-dateutil>=2.8.2"
                install "python-dotenv>=1.0.0"
                install "toml>=0.10.2"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

tasks.register('copyPythonSources', Copy) {
    from '../../mastui'
    into 'src/main/python/mastui'
    exclude '**/__pycache__', '**/*.pyc'
}

tasks.matching { it.name.contains('PythonSources') }.configureEach {
    dependsOn 'copyPythonSources'
}

tasks.named('preBuild') {
    dependsOn 'copyPythonSources'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
